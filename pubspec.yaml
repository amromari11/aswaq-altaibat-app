name: aswaq_altaibat
description: "Aswaq Altaibat (أسواق الطيبات) — Q-commerce grocery app for Zarqa, Jordan."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.5.6

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Fonts & design
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Home screen carousels / indicators
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.1.0

  # Formatting
  intl: ^0.20.3 # version pinned by flutter_localizations' own constraint

  # Abandoned-cart local reminder
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Delivery location picker (Google Maps based)
  google_maps_flutter: ^2.9.0
  geocoding: ^3.0.0

  # Shared by both location pickers
  geolocator: ^10.1.0

  # OpenStreetMap-based alternative picker (no Google Maps API key needed)
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lottie/

  # Google Fonts are fetched at build time by the google_fonts package, so no
  # local font files are declared here. If this app ever needs to work fully
  # offline on first launch, switch to bundled .ttf files instead — see
  # https://pub.dev/packages/google_fonts#offline-support.
